<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>digital-signature-field · Angular demo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <a class="all-demos" href="https://github.com/DenysSlobodianyk1996/digital-signature-field#demos"><span aria-hidden="true">←</span> All demos</a>
    <script>
      // On GitHub Pages each demo lives at <site>/<demo>/, so the demos index is one level up from the
      // demo's base. Served at the root (local dev) there is no index: the link keeps the README's demo list.
      (function (link, base) {
        if (base !== '/') link.href = new URL('../', new URL(base, location.href)).pathname;
      })(document.currentScript.previousElementSibling, new URL(document.baseURI).pathname);
    </script>
    <app-root></app-root>
  </body>
</html>
