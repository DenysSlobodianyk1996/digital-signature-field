<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="600" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#111827">Variant 5 — Preview + dialog (recipe, not in the library)</text>
  <!-- form preview -->
  <text x="20" y="62" font-size="12" fill="#374151">Signature *</text>
  <rect x="20" y="70" width="220" height="110" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <path d="M40,150 C50,100 68,95 70,140 S88,170 100,130 S122,95 128,140 S150,160 162,125 S190,110 200,140" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
  <text x="20" y="200" font-size="12" fill="#2563eb" text-decoration="underline">Change signature</text>
  <text x="20" y="226" font-size="10" fill="#6b7280">&lt;img [src]="form.signature"&gt;</text>
  <line x1="250" y1="196" x2="300" y2="196" stroke="#6b7280" marker-end="url(#a)"/>
  <!-- dialog -->
  <rect x="300" y="44" width="286" height="282" rx="12" fill="#ffffff" stroke="#9ca3af"/>
  <text x="316" y="70" font-size="13" font-weight="600" fill="#111827">Sign here</text>
  <rect x="312" y="80" width="262" height="186" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="322" y="90" width="242" height="128" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <line x1="336" y1="196" x2="550" y2="196" stroke="#d1d5db" stroke-dasharray="4 4"/>
  <rect x="436" y="226" width="58" height="28" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="465" y="245" font-size="12" text-anchor="middle" fill="#111827">↶ Undo</text>
  <rect x="502" y="226" width="62" height="28" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="533" y="245" font-size="12" text-anchor="middle" fill="#111827">✕ Clear</text>
  <rect x="420" y="280" width="70" height="32" rx="6" fill="#fff" stroke="#9ca3af"/>
  <text x="455" y="301" font-size="13" text-anchor="middle" fill="#111827">Cancel</text>
  <rect x="498" y="280" width="76" height="32" rx="6" fill="#2563eb"/>
  <text x="536" y="301" font-size="13" text-anchor="middle" fill="#ffffff">Save</text>
</svg>
