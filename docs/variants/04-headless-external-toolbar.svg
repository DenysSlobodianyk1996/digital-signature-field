<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#111827">Variant 4 — Headless, the app's own toolbar</text>
  <!-- app page -->
  <rect x="10" y="40" width="540" height="310" rx="12" fill="#f3f4f6"/>
  <text x="24" y="60" font-size="11" fill="#6b7280">Host application</text>
  <!-- component -->
  <rect x="24" y="70" width="512" height="190" rx="10" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="86" font-size="11" fill="#2563eb">&lt;digital-signature-field actions="none"&gt;</text>
  <rect x="36" y="94" width="488" height="154" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <line x1="60" y1="222" x2="500" y2="222" stroke="#d1d5db" stroke-dasharray="4 4"/>
  <path d="M80,205 C95,140 120,130 122,190 S150,235 170,175 S205,125 215,185 S250,215 270,165 S315,140 322,195" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  <!-- external toolbar -->
  <rect x="24" y="296" width="120" height="38" rx="19" fill="#ffffff" stroke="#7c3aed"/>
  <text x="84" y="320" font-size="13" text-anchor="middle" fill="#7c3aed">Start over</text>
  <rect x="154" y="296" width="90" height="38" rx="19" fill="#ffffff" stroke="#7c3aed"/>
  <text x="199" y="320" font-size="13" text-anchor="middle" fill="#7c3aed">Undo</text>
  <rect x="416" y="296" width="120" height="38" rx="19" fill="#7c3aed"/>
  <text x="476" y="320" font-size="13" text-anchor="middle" fill="#ffffff">Sign &amp; submit</text>
  <!-- arrows -->
  <text x="28" y="282" font-size="11" fill="#374151">↑ app buttons call clear() / undo()</text>
  <text x="532" y="282" font-size="11" text-anchor="end" fill="#374151">↓ dsf-history-change enables / disables them</text>
</svg>
